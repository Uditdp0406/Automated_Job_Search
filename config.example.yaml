# Copy to config.yaml and edit.  (config.yaml is git-ignored because it holds personal answers.)
model: claude-opus-5-5
data_dir: data        # profile, resume text, jobs.db
output_dir: output    # tailored resumes, cover letters, screenshots (one folder per job)

search:
  titles: []                     # extra titles; Claude also derives titles from your resume
  keywords: []                   # e.g. ["python", "backend"]; default = resume-derived keywords
  locations: []                  # e.g. ["Bengaluru", "India"]; empty list = anywhere
  remote_ok: true
  exclude_keywords: ["security clearance", "unpaid"]
  exclude_companies: []
  greenhouse_boards: []          # board tokens, e.g. boards.greenhouse.io/<token>
  lever_companies: []            # slugs, e.g. jobs.lever.co/<slug>
  use_remotive: true             # remote jobs (manual apply - external sites)
  use_web_discovery: true        # Claude web search finds more Greenhouse/Lever companies
  max_jobs_to_score: 40          # caps Claude calls per run (most relevant jobs are scored first)
  max_age_days: 45               # skip postings older than this; 0 = no limit
  scoring_workers: 4             # parallel scoring calls

apply:
  min_score: 70                  # only apply to jobs Claude scores at least this
  max_applications_per_run: 10
  auto_submit: false             # false = agent fills the form, YOU review and click Submit
  headless: false
  # YOUR answers for legal / eligibility / demographic questions. The agent only uses these and
  # never guesses; values left as "TODO" are ignored and those questions are flagged for you.
  standard_answers:
    work_authorization: "TODO e.g. Authorized to work in India; need sponsorship for the US"
    requires_sponsorship: "TODO Yes / No"
    notice_period: "TODO e.g. 30 days"
    earliest_start_date: "TODO"
    expected_salary: "TODO e.g. Negotiable"
    willing_to_relocate: "TODO Yes / No"
    how_did_you_hear: "Company careers page"
    gender: "TODO or 'Prefer not to say'"
    veteran_status: "TODO"
    disability_status: "TODO"
